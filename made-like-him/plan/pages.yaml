# ── GATE 1 PASSED — signed 2026-09-27, see plan/theology-review.md ──
# All twelve decisions ruled and folded in below. `ruling:` fields record which decision
# governs a page, so the reasoning travels with the work.
#
# Sources (Track 2 of the album, saved as series assets 2026-09-27):
#   kids/_brand/album/lyrics.md          § "2. Made Like Him"
#   kids/_brand/album/teaching-script.md § "Track 2 — Made Like Him"
#   kids/_brand/album/music-style.md     § "2. Made Like Him"  — joyful, confident,
#     empowering; "kids celebrating their God-given identity as image-bearers". That is the
#     book's register: every page is an image-bearer DOING something, never posing.
#
# Doctrinal spine — WSC Q.10: "God created man male and female, after his own image, in
# knowledge, righteousness, and holiness, with dominion over the creatures." Pages 9-19
# walk those four in the song's own words: love, think, choose, walk with God / rule.
#
# Arc (follows the song's verse 1 -> verse 2 -> bridge, and the teaching script's turn
# from Adam and Eve to "every single person you'll ever meet"):
#   p3-p11   IN THE BEGINNING — the first man and woman (Genesis 1-2), DECISION-5 treatment
#   p13-p19  AND YOU TOO — what the image is, shown in the family cast doing it
#   p21-p27  EVERY PERSON — why every life matters (Ps 139, Acts 17, James 3, Ps 8)
#   p29-p31  FOR HIS GLORY — the image's purpose, and Christ the true Image (text only)
#
# Translation: WEB (genesis-1 DECISION-4). Page text is paraphrase unless `quote: true`.
# Quotes keep WEB's "Yahweh" (guardrails §6); first appearance is p5, with the fixed line.
# Style: FLAT-VECTOR throughout — brand-spec reserves the naturalistic mode for Book One.

meta:
  scope: "Genesis 1:26-28; 2:7, 15, 19-22 (stops before 2:16)"
  translation: "WEB (public domain)"
  reading_level: "ages 4-7, one sentence per page, read aloud by an adult"
  gate1_signed: "2026-09-27"

pages:

  # ── IN THE BEGINNING ──────────────────────────────────────────────────────────

  - page: 3
    ref: "Genesis 1:26"
    title: "Something Brand New"
    text: "Then God said, 'Let us make people like us.'"
    teaching: "God had made the sky, the sea, the plants and every animal. But He saved the most amazing thing for last. Before the first person ever breathed, God had already planned to make you."
    scene: "The whole finished creation, wide and full, with NO people in it — a garden landscape
            waiting. Large rounded trees, a winding river, gentle hills, a few animals grazing
            in the distance, large rounded clouds. Open ground in the centre foreground, empty,
            as if a space has been kept. No figure of any kind. No face, hands or light-shape in
            the sky. Wild plants, trees and grass ONLY — NO vegetables, crops, garden beds or
            rows (Gen 2:5: no plant of the field yet, and no man to work the ground)."
    density: sparse        # Gate 2 ruling — lock is the busiest page; exempt from low-ink drift
    thicken_thin_strokes: true   # QA 2026-09-29: strokes at 1.59pt under the 2pt floor — post fix, as genesis-1
    alt: "A wide, peaceful garden with animals and a river, and an open space in the middle."
    ruling: "DECISION-9 — 'Let us' left plain; no plural claim in the teaching line."

  - page: 5
    ref: "Genesis 2:7"
    title: "Made from the Dust"
    text: "Yahweh God formed man from the dust of the ground, and breathed into his nostrils the breath of life; and man became a living soul."
    quote: true             # WEB Gen 2:7 — verified against ebible.org/eng-web 2026-09-27
    teaching: "Yahweh is God's own special name — the name He gave His people to call Him. Our bodies came from the ground, but our life came from God."
    scene: "One small figure seen FROM BEHIND, at distance, standing at the edge of the garden at
            first light, looking out over it — the moment just after.
            Open ground at his feet. Nothing above him: no hands, no face, no breath or wind
            shape coming from the sky, no beam of light pointing at him. The figure is SMALL —
            no more than a quarter of the page height — in the lower middle of a wide landscape.
            NO animals of any kind, NO vegetables or crops on this page."
    figures: "first-couple"
    character_ref: "kids/_brand/p25-figures-ref.jpg"   # genesis-1 first-couple construction
    density: sparse        # Gate 2 ruling — lock is the busiest page; exempt from low-ink drift
    alt: "A small figure seen from behind, standing at the edge of a garden at sunrise."
    ruling: "DECISION-1 — the moment after, not the forming; nothing implying a divine actor.
             DECISION-2 — first-couple treatment. DECISION-8 / guardrails §6 — first appearance
             of 'Yahweh' in this book; fixed teaching line opens the caption."

  - page: 7
    ref: "Genesis 1:27; 2:22"
    title: "Male and Female"
    text: "God created man in his own image. In God's image he created him; male and female he created them."
    quote: true             # WEB Gen 1:27 — verified against ebible.org/eng-web 2026-09-27
    teaching: "God made the first man, and then He made the first woman and brought her to him. Two different people, both made in God's image — and God said it was very good."
    scene: "The man and the woman seen FROM BEHIND, at distance, side by side at the edge of a
            river, one pointing out across the water. Male and female read by build and hair
            ONLY, exactly per genesis-1 p25. Composition must differ from genesis-1 p25 and
            p27: no tending plants, no fruit, no reaching toward an animal."
    figures: "first-couple"
    character_ref: "kids/_brand/p25-figures-ref.jpg"   # genesis-1 first-couple construction
    density: sparse        # Gate 2 ruling — lock is the busiest page; exempt from low-ink drift
    alt: "A man and a woman seen from behind, standing together beside a river."
    ruling: "DECISION-2 — genesis-1 DECISION-5 carried; simple garments as a disclosed print
             convention (p33 footnote); Eve's creation shown as result only, no sleep, no rib."

  - page: 9
    ref: "Genesis 2:19-20"
    title: "Naming the Animals"
    text: "God brought the animals to the man, and he gave each one its name."
    teaching: "God can think and know, and He made us able to think and learn too. Adam looked carefully at every creature and gave it just the right name."
    scene: "The man FROM BEHIND, at mid-distance, arm raised toward a line of animals walking
            past — a giraffe, a camel, a goat, a bear, a hen — each clearly a different kind.
            Animals sized and simplified to flat-vector detail. No lion, no elephant, no
            tortoise (genesis-1 p23's cast)."
    figures: "first-couple"
    character_ref: "kids/_brand/p25-figures-ref.jpg"   # genesis-1 first-couple construction
    alt: "A man seen from behind, pointing toward a line of different animals."
    ruling: "DECISION-2."

  - page: 11
    ref: "Genesis 2:15; 1:28"
    title: "Tending the Garden"
    text: "God put the man and woman in the garden to work it and take care of it."
    teaching: "Work was God's good gift before anything ever went wrong. When we take care of what God made, we are doing what we were made for."
    scene: "The man and woman FROM BEHIND at mid-distance, planting a young tree together — one
            holding the sapling upright, one pressing soil around it with a simple digging
            stick. A watering path from the river. Generic fruit trees only; no single
            central or special tree."
    figures: "first-couple"
    character_ref: "kids/_brand/p25-figures-ref.jpg"   # genesis-1 first-couple construction
    alt: "A man and woman seen from behind, planting a young tree together."
    ruling: "DECISION-2; DECISION-12 — generic trees only, no tree of knowledge, no command."

  # ── AND YOU TOO ───────────────────────────────────────────────────────────────

  - page: 13
    ref: "1 John 4:19"
    title: "Made to Love"
    text: "God is love, and He made us able to love."
    teaching: "We love because God loved us first. When you hug someone, share with them or forgive them, you are showing a little picture of what God is like."
    scene: "The family cast (character-bible, fully faced): Father lifting Son up in a hug, Mother
            and Daughter 3 embracing beside them, the dog jumping at their feet. Arms held away
            from torsos per bible construction rules. Indoor-outdoor doorstep setting."
    character_ref: "kids/_brand/cast-sheet.jpg"
