  - page: 27
    ref: "Psalm 8:4-6"
    title: "Only People"
    text: "God made animals wonderful — but only people are made in His image."
    teaching: "Your dog can play and your cat can purr, and God made them good. But only people were made to know God, talk to Him and love Him back."
    scene: "Son kneeling on the grass with hands folded in prayer, eyes closed, the family dog
