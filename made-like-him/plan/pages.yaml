    title: "Naming the Animals"
    text: "God brought the animals to the man, and he gave them their names."
    teaching: "In Adam, humanity’s calling to think, learn, and name reflects God’s wise rule; in Christ, the image is renewed in true knowledge, so we learn to see and order creation under our Creator."   # author-supplied 2026-10-04, verbatim + closing period at his instruction (replaces the line that repeated p15's opening)
    scene: "The man FROM BEHIND, at mid-distance, arm raised toward a line of animals walking
            past — a giraffe, a camel, a goat, a bear, a hen — each clearly a different kind.
            Animals sized and simplified to flat-vector detail. No lion, no elephant, no
            tortoise (genesis-1 p23's cast)."
    figures: "first-couple"
    character_ref: "kids/_brand/p25-figures-ref.jpg"   # genesis-1 first-couple construction
    alt: "A man seen from behind, pointing toward a line of different animals."
    ruling: "DECISION-2."

  - page: 11
    ref: "Genesis 2:15; 1:28"
    title: "Tending the Garden"
    text: "God placed the man in the garden to work and take care of it."
    teaching: "Work was God's good gift before the fall. He gave mankind dominion to act as loving stewards over His creation, reflecting His own royal care."
    scene: "The man and woman FROM BEHIND at mid-distance, planting a young tree together — one
