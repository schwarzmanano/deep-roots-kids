      Son: "short-sleeved t-shirt and shorts"
    alt: "A family hugging on their doorstep while the dog jumps beside them."
    ruling: "DECISION-3 — faced, mid-shot, action named. DECISION-4 — no mirror."

  - page: 15
    ref: "Colossians 3:10"
    title: "Made to Think and Know"
    text: "God knows everything, and He made us able to think and learn."
    teaching: "God gave you a mind so you could learn about His world — and most of all, so you could know Him. That's why we read His Word together."
    scene: "Father on a bench reading an open Bible, Daughter 2 beside him following along with
            her finger, Son leaning on his knee, looking up at the page. Large simple book shape,
