  - page: 23
    ref: "Acts 17:26; Genesis 9:6"
    title: "Every Person"
    text: "Every person, in every nation, is made in God's image."
    teaching: "Your mom, your dad, your friends, the person you've never met — every one of them carries God's image. That's why every person matters."
    scene: "A small, friendly street market with two simple fruit stalls. The family members here
            are Mother, Daughter 2 and Son, walking together in the middle. Around
            them, exactly FIVE neighbours and no more: an old man with a walking stick; a woman
            in a wheelchair; a tall man with short straight hair; the visiting mother with one
            high round bun, holding the hand of EXACTLY ONE toddler with two small round hair
            puffs (the child from p21). No other children. The neighbours have plain hairstyles —
            short, straight, curly or a bun — and NONE wear glasses, locs, braids, beads or a
            head wrap. NO garden, NO vegetables, NO watering can, NO tools, NO dog."
    figures: ["family", "outside-cast"]
    # character_ref removed round 3: the cast sheet leaked family markers onto strangers twice
    outfits:               # character-bible v2.0 — tested vocabulary only
