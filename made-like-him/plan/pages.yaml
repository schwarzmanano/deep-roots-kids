    ruling: "DECISION-3."

  # ── EVERY PERSON ──────────────────────────────────────────────────────────────

  - page: 21
    ref: "Psalm 139:13-14"
    title: "Planned on Purpose"
    text: "God made you on purpose — you are not an accident."
    teaching: "Before you were born, God knew you and made you with care. The Bible says you are 'fearfully and wonderfully made.'"
    scene: "A newborn baby being welcomed: the baby's own mother (NOT a cast member — high round
