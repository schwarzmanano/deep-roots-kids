  - page: 31
    ref: "Colossians 1:15; 3:10"
    title: "The Perfect Image"
    text: "Jesus is the perfect image of God, and He makes us new."
    teaching: "Sin smudged God's image in us, like a scratched mirror. But Jesus is God's perfect Image — and when we trust Him, He makes us new, more and more like Him."
    scene: "Evening worship: the family sitting close on the floor around a large open Bible,
            Mother pointing to the page, the lamp from p29 burning low, a window showing stars.
            No cross, no light-shape, no symbol standing for Christ — Christ is carried by the
            text alone (theology-guardrails §2). ALL SIX family members present, including
            Daughter 3 with beaded braids. Mother's wavy hair visible below her head wrap. The
            Bible's pages are blank — no pictures in the book."
    character_ref: "kids/_brand/cast-sheet.jpg"
    figures: "family"
    outfits:               # character-bible v2.0 — tested vocabulary only
      Father: "short-sleeved pyjama top and pyjama trousers"
      Mother: "short-sleeved nightgown to the ankle; head wrap"
      Daughter1: "short-sleeved pyjama top and pyjama trousers"
      Daughter2: "short-sleeved nightgown to mid-calf"
      Daughter3: "short-sleeved nightgown to the knee"
      Son: "short-sleeved pyjama top and pyjama shorts"
