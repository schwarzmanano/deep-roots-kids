  - page: 17
    ref: "Ephesians 4:24"
    title: "Made to Choose What Is Right"
    text: "God is good, and He made us able to choose what is good."
    teaching: "Adam and Eve could choose to trust God. Today, we need God's help to choose what is right — and He gives it. Jesus always chose right, for us."
    scene: "Daughter 3 handing her big round ball to Son, who reaches out for it — sharing her
            toy. A grassy yard, a small toy box beside her, the dog watching. NO fruit and NO food
            anywhere on this page."
    character_ref: "kids/_brand/cast-sheet.jpg"
    figures: "family"
    outfits:               # character-bible v2.0 — tested vocabulary only
      Daughter3: "sleeveless sundress to the knee"
      Son: "short-sleeved t-shirt and shorts"
    alt: "A girl sharing her ball with her little brother."
    amended: "2026-09-28 — round 1 drew a girl handing a boy an apple: the Eve/Adam picture, one
              book before Book Three, against this book's no-fruit-taken scope rule. Plan error,
              not a model error. Scene changed to sharing a toy; page text unchanged."
    ruling: "DECISION-10 — the gift stated; Adam then vs. God's help now; Christ's obedience for us."

  - page: 19
    ref: "Genesis 1:28; Psalm 8:6"
    title: "Made to Care for God's World"
    text: "God put us in charge of His world, to take care of it for Him."
    teaching: "God is the true King of everything. He gave people a job: to look after His world like good helpers look after the King's garden."
    scene: "The whole family in a small vegetable garden: Mother watering with a can, Daughter 1
            and Father digging a row, Daughter 2 carrying a plain smooth basket held out from her
            body, Son holding a small plant up to show, Daughter 3 pulling up one big carrot with
            both hands, the dog digging beside them. All six family members appear. Only a FEW
            vegetables — three or four leafy plants and at most two pumpkins — all in the MIDDLE
            band of the page, between the people. The bottom fifth of the page is plain open
            grass with nothing on it. Nothing touches or crosses any page edge: every plant,
            pumpkin and cloud sits wholly inside the frame with white space around it. No
            horizon line running edge to edge. Water from the can as three or four LARGE drops.
            Mother's wavy hair clearly visible below her head wrap. Every person has a face."
    character_ref: "kids/_brand/cast-sheet.jpg"
    style_reference: true
    thicken_thin_strokes: true   # Gate 2: 2 strokes at 1.59pt on the locked attempt
    figures: "family"
    outfits:               # character-bible v2.0 — tested vocabulary only
      Father: "short-sleeved t-shirt and knee-length shorts"
      Mother: "short-sleeved straight dress to mid-calf; head wrap"
      Daughter1: "short-sleeved t-shirt and full-length trousers"
      Daughter2: "short-sleeved A-line dress to the knee"
      Daughter3: "short-sleeved dress with a hem band, to the knee"
      Son: "short-sleeved t-shirt and shorts"
