    alt: "A little boy praying on the grass while his dog lies beside him."
    ruling: "DECISION-5 — printed positively; no monkey or ape on the page. Audio unchanged."

  # ── FOR HIS GLORY ─────────────────────────────────────────────────────────────

  - page: 29
    ref: "Isaiah 43:7; Matthew 5:16"
    title: "Made for His Glory"
    text: "God made us to shine His light, so everyone can see how good He is."
    teaching: "Jesus said, 'Let your light shine,' so people see the good things you do and praise your Father in heaven. That's what we were made for."
    scene: "The whole family singing and dancing in their living room — the song is a dance
            song — arms out, the dog mid-jump. On a table, a simple oil lamp on a stand with a
            small flame (Matt 5:15). NO rays, glow or light coming from any person."
    character_ref: "kids/_brand/cast-sheet.jpg"
