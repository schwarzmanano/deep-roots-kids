    ruling: "DECISION-6 — no printed colour words; diversity shown visually (guardrails §5).
             DECISION-7 — p21's child, now a toddler."

  - page: 25
    ref: "James 3:9-10"
    title: "That's Why We Are Kind"
    text: "Because every person is made like God, we treat every person with kindness."
    teaching: "The Bible says we can't praise God with our mouths and then say unkind things about people made like Him. Kind words honour God's image in others."
    scene: "Daughter 1 helping the old man (a neighbour seen on p23) carry a large bag, Daughter 2 holding a door
            open for them. Son and the child from p21 — now a YOUNG CHILD, two round hair puffs,
            about Son's height — wave together. The same street on another day. Daughter 2 is
