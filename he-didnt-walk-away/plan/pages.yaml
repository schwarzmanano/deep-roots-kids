#   kids/_brand/album/music-style.md     § "4." — "hopeful pop worship with gentle build from
#     reflective to joyful ... reassuring, joyful, faithful — God's grace stepping into the story".
#     That is the book's register: it opens where Book Three ended (reflective), and rises.
#   The companion curriculum (c2g-curriculum, Lesson 4) is ESV — nothing is copied from it.
#
# Architecture: identical to Books Two and Three — 36 pp, 15 single-sided illustrations
# (p3-p31 odd), p33 closing pointer page (author), p35 About the Author. No change proposed:
# the narrow text (3:14-15, 20-21) plus the family application divides into 2 bridge pages,
# 5 promise pages, 2 response pages (3:20-21), 2 "sent out, not abandoned" pages, 4 family
# pages and 1 closing illustration = 15. A shorter book would drop the family application
# or the bridge; neither can go (the Big Idea needs both halves).
#
# Arc (follows the song: verse 1 -> chorus -> verse 2 -> bridge -> outro):
#   p3-p5    WHEN WE RAN                — Book Three recalled: hiding, called (3:8-10 by picture only)
#   p7-p13   GOD SPEAKS FIRST           — 3:14-15: the serpent cursed, hostility, her offspring, the promise
#   p15-p17  THE PROMISE HELD           — 3:20 Eve named; 3:21 clothed
#   p19-p21  SENT OUT, NOT ABANDONED    — a light in the dark; leaving with the promise
#   p23-p29  HE DIDN'T WALK AWAY        — family application (D8): breaking, staying, mended, "GOD DID"
#   p31      THE HOPE IS NEAR           — closing illustration leaning toward Book Five (D9)
#
# Governing note for the whole book (R3): the mending is His promise, not our repair. Any
# scene, symbol or page order that could read as "we fixed it" is a defect.
# D4 (grace before merit): God speaks the promise (p7-p13) BEFORE any response from the
# couple (p15-p17); the Father comes to the Son (p25) BEFORE the Son says or does anything.
#
# Standing rules restated by the editor for this book (brief 2026-10-16): DECISION-1 (no person
# of the Trinity depicted; 3:14-19 speech shown by EFFECT only — light, the listening couple, the
# ground, the sky); the Rescuer PROMISED, not revealed — no Christ-marker anywhere (no cross,
# tomb, crown, throne, nail-marked hands, manger, dove, or human figure standing in for the
# offspring; symbolic only: seed, sprout, light, path, spoken word); DECISION-5 first-couple
# construction; guardrails §5 for non-cast figures; family cast per character-bible v2.2; WEB
# only, "Yahweh" kept, the author's line at its first appearance (F2).
#
# `pending:` names the Gate 1 decision(s) each scene waits on. Scenes are Stage 1 BASELINES —
# the editor's rulings amend them; nothing here is resolved.

