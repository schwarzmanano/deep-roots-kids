    heading: "The Promise Still Stands"   # author-supplied 2026-10-17, verbatim
    body: "When Adam and Eve turned away from God, God did not turn away from them. He came looking for them, cared for them, and made a promise before they had done anything to deserve it. A Rescuer would come to defeat the serpent and bring God’s people home.\n\nAdam and Eve left the garden, but they did not leave without hope. God’s promise went with them. They could not see the Rescuer yet, and the promise had not come true in their day. Still, they could trust the God who had spoken. His word was sure.\n\nWe also do wrong and cannot fix sin by ourselves. God is good, and his love is not something we earn. He stays close to the people who belong to him and keeps his promises, even when we feel far away. The story is still unfolding. In the next book, we will ask what kind of Hero we need."   # author-supplied 2026-10-17, verbatim
    footnote: "Note to parents: Adam and Eve are shown wearing simple garments to help young readers focus on the story. In this book, they wear them on pages before Genesis 3:21 as a visual convention."   # author-supplied 2026-10-17, verbatim
