# ── STAGE 1 — NOT SIGNED. Generation is blocked until plan/theology-review.md reads SIGNED. ──
#
# Book Three, "We Broke It All" — album Track 3. Plan only: scenes, references, alt-text,
# density. Every `text:` and `teaching:` is null — the author writes them in plan/my-words.md
# (authorship-policy §1.4, §14). Scene wording is production instruction, never print.
#
# Sources:
#   Genesis 3:1-14, 16-24 (WEB, ebible.org/eng-web/GEN03.htm, fetched 2026-10-01) — 3:15 is
#     Book Four's anchor and is NOT planned here (editor brief).
#   kids/_brand/album/lyrics.md          § "3. We Broke It All"   (lines 116-150)
#   kids/_brand/album/teaching-script.md § "Track 3 — We Broke It All" (lines 39-52)
#   kids/_brand/album/music-style.md     § "3. We Broke It All" — "honest, sorrowful but not
#     despairing, ending with rising hope". That is the book's register: no page frightens,
#     no page gloats, and the last pages lean forward without arriving.
#
# Architecture: identical to Book Two — 36 pp, 15 single-sided illustrations (p3-p31 odd),
# p33 closing (editor), p35 About the Author. No change proposed: Gen 3:1-24 minus 3:15
# divides naturally into 11 first-couple/serpent scenes; the remaining 4 carry the song's
# "every person" turn (D6 application pages, the broken world, all of us) — the same
# text-then-you shape as Book Two.
#
# Arc (follows the song: verse 1 -> chorus -> verse 2 -> bridge -> "this isn't the end"):
#   p3-p9    GOOD AND BRIGHT, THEN "NO"  — the garden, the serpent, the lie, the taking (3:1-6)
#   p11-p19  HIDING AND BLAMING          — eyes opened, hiding, "Where are you?", blame (3:7-13)
#   p21-p27  WHAT BROKE                  — serpent, ground, dust; the world; all of us (3:14-19)
#   p29-p31  NOT THE END                 — garments, sent out, the guarded way (3:20-24)
#
# Standing rules restated by the editor for this book (brief 2026-10-01): DECISION-1 (no person
# of the Trinity depicted; 3:8-19 speech and presence shown by EFFECT only — the couple hiding,
# trees, light, wind; no figure, hands or face in clouds); DECISION-5 first-couple construction
# matched EXACTLY to made-like-him p5-p11; guardrails §5 for non-cast figures; family cast per
# character-bible v2.2; WEB only; "Yahweh" kept, with the author's line at first appearance.
#
# `pending:` names the Gate 1 decision(s) a scene depends on. Where a scene describes a
# baseline, it is the decision-neutral part only; the ruling will amend it.

meta:
  scope: "Genesis 3:1-14, 16-24 (3:15 excluded — Book Four)"
  translation: "WEB (public domain)"
  reading_level: "ages 4-7, read aloud by an adult"
  gate1_signed: null
  yahweh_first_appearance: "Gen 3:1 is the first WEB verse in scope containing 'Yahweh'. The
    author's Yahweh line is due on whichever page FIRST prints a WEB quotation containing the
    name — p5 if p5 quotes 3:1 (see F2)."

pages:

  # ── GOOD AND BRIGHT, THEN "NO" ───────────────────────────────────────────────────

  - page: 3
    ref: "Genesis 2:9, 16-17 (recalled in 3:2-3)"
    title: "One Good Rule"
    text: "God made a world that was good and bright. We were made to trust Him, walk in His light."
    teaching: "God made everything good, and He made Adam and Eve in his image, on purpose, to be like him. God gave them one simple rule to show their trust."
    scene: "The garden in full brightness, wide: rounded trees, the river, animals at rest, the
            man and the woman FROM BEHIND at mid-distance tending plants together (made-like-him
            p11 construction). Two trees stand somewhere in the middle distance among others —
            not glowing, not haloed, not larger than the rest. No serpent yet. No fruit taken."
    figures: "first-couple"
    character_ref: "kids/_brand/p25-figures-ref.jpg"
    density: dense
    alt: "A bright garden where a man and a woman tend plants among many trees."
    pending: ["D2 (fruit/tree drawing)", "F1 (whether 2:16-17 is in scope)"]

  - page: 5
    ref: "Genesis 3:1"
    title: "The Serpent"
    text: "Now the serpent was more subtle than any animal of the field which Yahweh God had made. He said to the woman, “Has God really said, ‘You shall not eat of any tree of the garden’?”"
    quote: true             # WEB quotation (2026-10-01: "(WEB)" tag removed by ruling; guardrails §8)
    quote_ref: "Genesis 3:1"
    teaching: "A long time ago, the first people God made — Adam and Eve — had a choice. God’s special covenant name is used here: Yahweh."
    scene: "The woman FROM BEHIND at mid-distance near the tree in the middle of the garden.
            The serpent on or beside the tree, turned toward her. Daylight, calm. The serpent
            is the only creature drawn with any attention; other animals absent from this
            page. Nothing frightening in composition: no looming, no shadow over her."
    figures: "first-couple"
    character_ref: "kids/_brand/p25-figures-ref.jpg"
    density: sparse
    alt: "A woman in a garden, and a serpent on a tree speaking to her."
    pending: ["D1 (serpent)", "D2 (tree/fruit)", "F2 (Yahweh first appearance)"]

  - page: 7
    ref: "Genesis 3:4-5"
    title: "The Lie"
    text: "The serpent said to the woman, “You won’t really die, for God knows that in the day you eat it, your eyes will be opened, and you will be like God, knowing good and evil.”"
    quote: true             # WEB quotation (2026-10-01: "(WEB)" tag removed by ruling; guardrails §8)
    quote_ref: "Genesis 3:4-5"
    teaching: "The serpent lied. He told them they could be like God if they disobeyed, even though God had already made them to be like Him!"
    scene: "Closer than p5 but still from behind the woman: she looks up at the tree's fruit;
            the serpent coils on a low branch between her and the fruit. The man stands a little
            way off, also from behind (3:6 'her husband with her'). No hand on the fruit yet."
    figures: "first-couple"
    character_ref: "kids/_brand/p25-figures-ref.jpg"
    density: sparse
    alt: "A woman looking up at fruit on a tree while a serpent watches from a branch."
    pending: ["D1", "D2", "F6 (\"like God\" — Book Two echo)"]

  - page: 9
    ref: "Genesis 3:6"
    title: "We Said No"
    text: "But we said “No,” we chose our own way. We turned from God—we didn’t obey."
    teaching: "They said, \"No, we'll do it our own way instead.\" They turned away from God. They wanted to lead, they wanted control, but sin broke our world—and it hurt our souls."
    scene: "The moment of taking, shown at distance and from behind: the woman's single-line arm
            reaches to a low branch; the man stands beside her. The fruit is small in the frame.
            No bite, no mouth, no faces. The serpent is gone from the branch or barely visible."
    figures: "first-couple"
    character_ref: "kids/_brand/p25-figures-ref.jpg"
    density: sparse
    alt: "A woman reaching to pick fruit from a tree, with a man beside her."
    pending: ["D2"]

  # ── HIDING AND BLAMING ───────────────────────────────────────────────────────────

  - page: 11
    ref: "Genesis 3:7"
    title: "Eyes Opened"
    text: "Their eyes were opened, and they both knew that they were naked. They sewed fig leaves together, and made coverings for themselves."
    quote: true             # WEB quotation (2026-10-01: "(WEB)" tag removed by ruling; guardrails §8)
    quote_ref: "Genesis 3:7"
    teaching: "For the very first time, they felt shame. They tried to fix it and hide what they had done by making their own coverings."
    scene: "The man and the woman FROM BEHIND, turned away from each other, heads down, sitting
            or crouching apart beside a large fig tree with big simple lobed leaves. Body
            language carries the shame: turned away, small, apart (D5)."
    figures: "first-couple"
    character_ref: "kids/_brand/p25-figures-ref.jpg"
    density: sparse
    alt: "A man and a woman sitting apart and turned away from each other under a fig tree."
    pending: ["D3 (fig leaves vs existing garments)", "D5 (shame)"]

  - page: 13
    ref: "Genesis 3:8-10"
    title: "Where Are You?"
    text: "Yahweh God called to the man, and said to him, “Where are you?” The man said, “I heard your voice in the garden, and I was afraid, because I was naked; so I hid myself.”"
    quote: true             # WEB quotation (2026-10-01: "(WEB)" tag removed by ruling; guardrails §8)
    quote_ref: "Genesis 3:9-10"
    teaching: "Why do we sometimes feel afraid? When they sinned, Adam and Eve were so scared that they tried to hide from God’s presence. But God came looking for them."
    scene: "Eden at dusk ('the cool of the day'): long low sun shown as a plain half-circle on
            the horizon (no rays, no face), wind lines through the treetops, leaves blowing.
            The man and the woman partly hidden behind tree trunks and bushes in the middle
            distance, peeking. NOTHING ELSE in the garden — no figure, no footprints, no hand,
            no light-shape, no voice-lines from the sky. The presence is shown only by its
            effect: the couple hiding, the moving trees (DECISION-1)."
    figures: "first-couple"
    character_ref: "kids/_brand/p25-figures-ref.jpg"
    density: dense
    alt: "A garden at sunset with wind in the trees and two people hiding behind them."
    pending: ["D5", "F3 (WEB 3:8 reads 'voice walking')"]

  - page: 15
    ref: "Genesis 3:7-10 applied; Psalm 32:5"
    title: "We Hide Too"
    text: "It's why we sometimes disobey and fight, even when we know better."
    teaching: "Just like Adam and Eve, when we do wrong things, we want to hide them. But God wants us to confess our sins to Him, not hide them in the dark."
    scene: "PENDING D6. Baseline if D6 approves family pages: an ordinary indoor moment — a
            family cast child (named by the D6 ruling) beside a broken household object (a
            plant pot cracked in two, soil spilled), pushing it behind a sofa or curtain. The
            dog watches. Small, ordinary wrongdoing; nothing frightening, nothing humiliating,
            no adult looming. If D6 rules NO: this page becomes first-couple 3:10 ('I was
            afraid') or the page count is re-planned at Gate 1."
    figures: "family"
    character_ref: "kids/_brand/cast-sheet.jpg"
    outfits: "PENDING D6 — sleeveless top / knee hems only (character-bible v2.0 tested vocabulary)"
    density: sparse
    alt: "A child hiding a broken plant pot behind the sofa while the dog watches."
    pending: ["D6", "D5"]

  - page: 17
    ref: "Genesis 3:11-13"
    title: "It Wasn't Me"
    text: "The man said, “The woman whom you gave to be with me, she gave me fruit from the tree, and I ate it.” Yahweh God said to the woman, “What have you done?” The woman said, “The serpent deceived me, and I ate.”"
    quote: true             # WEB quotation (2026-10-01: "(WEB)" tag removed by ruling; guardrails §8)
    quote_ref: "Genesis 3:12-13"   # 2026-10-01 ruling: complete WEB 3:13 (no omission)
    teaching: "Instead of admitting they were wrong, the man blamed the woman, and the woman blamed the serpent. Sin makes it so easy to point fingers at everyone else."
    scene: "The chain of blame, at distance, from behind/three-quarter behind: the man's single
            pointing arm toward the woman; the woman's single pointing arm toward the serpent on
            the ground; the serpent turned away. One pointing gesture each (bible v2.2: allowed
            when the story needs it). Dusk light as p13. No figure they are speaking to —
            they face an empty space among the trees (DECISION-1)."
    figures: "first-couple"
    character_ref: "kids/_brand/p25-figures-ref.jpg"
    density: sparse
    alt: "A man pointing at a woman, and the woman pointing at a serpent."
    pending: ["D1", "D6 (how blame is drawn)"]

  - page: 19
    ref: "Genesis 3:12-13 applied; 1 John 1:9"
    title: "We Blame Too"
    text: "Why do people fight? Do you fight sometimes? All the time?"
    teaching: "We point fingers and blame our friends and family too. But if we confess what we did wrong, God is faithful to forgive us."
    scene: "PENDING D6. Baseline if D6 approves: the SAME scene and outfits as p15 (one scene
            across p15 -> p19, character-bible v2.0) — a parent crouches at the child's height
            beside the broken pot, calm and open-armed; the child points toward the dog (or a
            sibling, per ruling). The dog looks puzzled. The parent's posture is patient, not
            angry. No tears drawn large, no shouting lines."
    figures: "family"
    character_ref: "kids/_brand/cast-sheet.jpg"
    outfits: "PENDING D6 — identical to p15"
    density: sparse
    alt: "A parent kneeling calmly by a broken pot while a child points at the dog."
    pending: ["D6"]

  # ── WHAT BROKE ───────────────────────────────────────────────────────────────────

  - page: 21
    ref: "Genesis 3:14"
    title: "On Its Belly"
    text: "Yahweh God said to the serpent, “Because you have done this, you are cursed above all livestock, and above every animal of the field. You shall go on your belly and you shall eat dust all the days of your life.”"
    quote: true             # WEB quotation (2026-10-01: "(WEB)" tag removed by ruling; guardrails §8)
    quote_ref: "Genesis 3:14"
    teaching: "Because God is perfectly good, He had to judge their sin. He started with the serpent who told the lie."
    scene: "The serpent alone, on the ground among dust and small stones, moving away across bare
            earth at the garden's edge. No people on this page. NOTHING from 3:15: no woman, no
            heel, no foot, no child, no crushed head, no seed, no light, no path."
    figures: []
    density: sparse
    alt: "A serpent crawling away across dusty ground."
    pending: ["D1", "F11 (3:15 boundary)"]

  - page: 23
    ref: "Genesis 3:17-19 (and 3:16)"
    title: "Thorns and Hard Work"
    text: "Now there’s sadness, pain, and fear. Broken hearts and lots of tears."
    teaching: "Because the ground was cursed, work became hard. It's why the world has sickness, and sadness, and things that just are not the way they're supposed to be."
    scene: "PENDING D7. Baseline: outside the garden, hard ground. The man FROM BEHIND at
            mid-distance working stony ground with a simple digging stick, thistle and thorn
            plants around the edge of his plot, the sun high. The woman per D7 ruling."
    figures: "first-couple"
    character_ref: "kids/_brand/p25-figures-ref.jpg"
    density: dense
    alt: "A man digging hard, stony ground surrounded by thorny plants."
    pending: ["D7", "D9", "F4 (3:16b)"]

  - page: 25
    ref: "Romans 8:20-22; Genesis 3:19 (pointer)"
    title: "Not How It's Supposed to Be"
    text: "Fighting, sickness, wrong and right. Nothing’s the same—it’s not how it’s supposed to be."
    teaching: "This might sound like a sad thing to talk about, and it is very sad. But friends, we don't have to be afraid. The whole creation is waiting in hope!"
    scene: "PENDING D9. Baseline — the song's verse 2 ('sadness, pain and fear... sickness') as
            ordinary family life, gently: a family cast child in bed with a blanket, a parent
            sitting beside with a cup; through the window a garden with a wilted flower and a
            broken fence. Care is the centre of the picture, not the illness."
    figures: "family"
    character_ref: "kids/_brand/cast-sheet.jpg"
    outfits: "PENDING — sleepwear from tested vocabulary (sleeveless pyjama vest/shorts, nightgown)"
    density: sparse
    alt: "A parent caring for a child who is sick in bed."
    pending: ["D9"]

  - page: 27
    ref: "Isaiah 53:6a; Romans 3:23; Romans 5:12"
    title: "All of Us"
    text: "Every person, big and small. Me and you—we’re all born wrong. We can’t fix this on our own. We need help to bring us home."
    teaching: "\"For all have sinned and fall short of the glory of God.\" (Romans 3:23, ESV) Did you notice that word \"all\"? Everyone has turned to their own way."
    scene: "Rolling hills with a flock of sheep scattered and wandering in different directions,
            each turned its own way; one sheep caught in a thorn bush. No shepherd, no staff,
            no person of any kind (a shepherd's staff is guardrails §1 vocabulary for Christ —
            Book Six onward)."
    figures: []
    density: sparse
    alt: "Sheep wandering off in every direction across the hills."
    pending: ["F8 (Isa 53:6b)", "F12 ('born wrong')"]

  # ── NOT THE END ──────────────────────────────────────────────────────────────────

  - page: 29
    ref: "Genesis 3:20-21"
    title: "Clothed"
    text: "Yahweh God made garments of animal skins for Adam and for his wife, and clothed them."
    quote: true             # WEB quotation (2026-10-01: "(WEB)" tag removed by ruling; guardrails §8)
    quote_ref: "Genesis 3:21"
    teaching: "Even after He judged them, God’s care continued. Eve was given a beautiful name, and God gave them real garments to wear."
    scene: "PENDING D3 / D4. Baseline: the man and the woman FROM BEHIND at mid-distance,
            standing together, wearing new garments that differ visibly from their Book Two
            garments (per D3/D4 ruling). Morning light as a plain half-circle. No actor, no
            hands, no animal, no carcass, no needle or tool."
    figures: "first-couple"
    character_ref: "kids/_brand/p25-figures-ref.jpg"
    density: sparse
    alt: "A man and a woman standing together in new clothes."
    pending: ["D3", "D4", "F5 (WEB 'animal skins')", "F9 (3:20 Eve named)"]

  - page: 31
    ref: "Genesis 3:22-24"
    title: "The Guarded Way"
    text: "Listen close—this isn’t the end… God has a plan… God wants to mend…"
    teaching: "Yes, sin is a real problem — but it's not the end of the story. Not even close."
    scene: "PENDING D8 / D10. Baseline: the couple FROM BEHIND, small, walking together away from
            the garden toward the east, across open land. Behind them, the garden's edge and
            its guarded entrance per the D8 ruling. Composition per D10 (how the last
            illustrated page leans forward)."
    figures: "first-couple"
    character_ref: "kids/_brand/p25-figures-ref.jpg"
    density: sparse
    alt: "A man and a woman walking away from the garden, whose way back is guarded."
    pending: ["D8", "D10", "F7 (3:22 'like one of us')", "F10 (tree of life)"]

  # ── BACK MATTER ──────────────────────────────────────────────────────────────────

  - page: 33
    ref: "back matter"
    title: "Closing Page"
    text: ""
    scene: ""
    alt: ""
    generate: false
    back_matter: true
    heading: "He Had a Plan"   # author-supplied 2026-10-01, verbatim
    body: "We broke it all. In Adam, we all chose our own way, we broke the good and bright world God made. We broke our relationship with God. We are lost and live in sadness, pain, and fear. It is a very sad truth.\n\nBut here's what I want you to hold onto today: God saw what happened, and God didn't just walk away and leave us in our mess. He had to send Adam and Eve out of the garden because He is perfectly just, but He still loved them as their compassionate Creator and didn't stop caring.\n\nHe already had a plan to fix what we broke. We couldn't fix this on our own, but God wanted to mend it. Even on the darkest day, there's good news coming…"   # author-supplied 2026-10-01, verbatim
    footnote: "Note to parents: To help our youngest readers focus on the story, Adam and Eve are drawn wearing simple garments as a visual convention throughout the series, even before Genesis 3:7 and 3:21."   # author-supplied 2026-10-01, verbatim
    note: "Editor-authored. Per the brief this may be the ONE closing pointer page that faces
           toward Book Four (D10); the author writes its words. Not drafted by the pipeline."

