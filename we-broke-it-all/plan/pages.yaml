#
# Book Three, "We Broke It All" — album Track 3. Plan only: scenes, references, alt-text,
# density. Every `text:` and `teaching:` is null — the author writes them in plan/my-words.md
# (authorship-policy §1.4, §14). Scene wording is production instruction, never print.
#
# Sources:
#   Genesis 3:1-14, 16-24 (WEB, ebible.org/eng-web/GEN03.htm, fetched 2026-10-01) — 3:15 is
#     Book Four's anchor and is NOT planned here (editor brief).
#   kids/_brand/album/lyrics.md          § "3. We Broke It All"   (lines 116-150)
#   kids/_brand/album/teaching-script.md § "Track 3 — We Broke It All" (lines 39-52)
#   kids/_brand/album/music-style.md     § "3. We Broke It All" — "honest, sorrowful but not
#     despairing, ending with rising hope". That is the book's register: no page frightens,
#     no page gloats, and the last pages lean forward without arriving.
#
# Architecture: identical to Book Two — 36 pp, 15 single-sided illustrations (p3-p31 odd),
# p33 closing (editor), p35 About the Author. No change proposed: Gen 3:1-24 minus 3:15
# divides naturally into 11 first-couple/serpent scenes; the remaining 4 carry the song's
# "every person" turn (D6 application pages, the broken world, all of us) — the same
# text-then-you shape as Book Two.
#
# Arc (follows the song: verse 1 -> chorus -> verse 2 -> bridge -> "this isn't the end"):
#   p3-p9    GOOD AND BRIGHT, THEN "NO"  — the garden, the serpent, the lie, the taking (3:1-6)
#   p11-p19  HIDING AND BLAMING          — eyes opened, hiding, "Where are you?", blame (3:7-13)
#   p21-p27  WHAT BROKE                  — serpent, ground, dust; the world; all of us (3:14-19)
#   p29-p31  NOT THE END                 — garments, sent out, the guarded way (3:20-24)
#
# Standing rules restated by the editor for this book (brief 2026-10-01): DECISION-1 (no person
# of the Trinity depicted; 3:8-19 speech and presence shown by EFFECT only — the couple hiding,
# trees, light, wind; no figure, hands or face in clouds); DECISION-5 first-couple construction
# matched EXACTLY to made-like-him p5-p11; guardrails §5 for non-cast figures; family cast per
# character-bible v2.2; WEB only; "Yahweh" kept, with the author's line at first appearance.
#
# `pending:` names the Gate 1 decision(s) a scene depends on. Where a scene describes a
# baseline, it is the decision-neutral part only; the ruling will amend it.

