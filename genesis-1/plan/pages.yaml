    title: "Day Seven — Rest"
    text: "On the seventh day God rested, and he made that day holy."
    teaching: "God rested on the seventh day, not because He was tired, but to bless it and make it holy. Jesus is our true rest — in Him, our tired hearts finally stop striving."
    scene: "A quiet landscape at rest, drawn full and complete. Layered rolling hills with several
