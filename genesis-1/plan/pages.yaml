  - page: 25
    ref: "Genesis 1:26-27"
    title: "Day Six — People"
    text: "God made people in his own image, and he loved them."
    teaching: "Out of everything God made, only people were made in His image. Jesus is the perfect Image of God — and He came to make broken image-bearers new."
    scene: "Two figures seen FROM BEHIND, at distance, small within a wide creation scene, faces
            entirely unseen. They are at work — tending plants, reaching toward an animal — in the
            act of the charge just given. Not posed, not static, not facing the viewer.
            No birds anywhere in this scene. No flying creature of any kind.
            HYBRID STYLE: the two human figures are drawn in the Deep Roots Kids flat-vector
            character construction — circle head, simple rounded tunic, every limb a single thin
            line, hands and feet plain ovals. The surrounding scene — plants, animals, ground,
            trees, sky — stays in this book's naturalistic line style.
            THE ONE CHANGE: the two figures must read clearly as one male and one female.
            Differentiate them ONLY by build and by hair length and shape — the female figure has
            longer, fuller hair reaching past the shoulder and a slighter build; the male figure
            has short cropped hair and a squarer, broader build. Both still seen from behind with
            no face visible. No glasses, no beads, no head wrap, no jewellery, no other markers."
    figures: "DECISION-5"   # -> style.md "## Human figures — DECISION-5, global rule"
    character_ref: "kids/_brand/character-ref-coloring.jpg"
    base_ref: "kids/_brand/p25-base-hybrid.jpg"
    alt: "Two small figures seen from behind, tending plants and animals in a wide landscape."
    ruling: "DECISION-5 — the image of God is shown in what they DO, not what they look like.
             Faces unseen means no bodily likeness is depicted, which sidesteps the Gen 2:25
             clothing question entirely — there is no fall-state to get wrong. No visual
             proximity to any depiction of God, consistent with DECISION-1."
    amended: "2026-09-17 — birds removed from this scene. THEOLOGICAL, not style: DECISION-1
              applied to this page. Nothing in Gen 1:26-28 places a bird beside the humans, and a
              solitary spread-winged bird here risks reading as the Spirit, or blurring the
              distinction the text draws between image-bearing humankind and every creature
              'after its kind' that came before them."
    amended_2: "2026-09-17 — figures differentiated as male and female. THEOLOGICAL: Gen 1:27 does
