            trees, and a broad band of calm water across the foreground drawn as two or three large
            smooth wave shapes. Fill the page from top to bottom. Draw with LARGE open shapes a child can colour — wide space inside every shape. Absolutely NO hatching, NO fine parallel lines, NO repeated thin strokes, NO texture.
            NO animals, NO birds, NO fish — living creatures are not made until the days after this."
    alt: "A sun and a crescent moon in the sky above hills."
    ruling: "DECISION-2 — plain nouns for the child's vocabulary; Genesis 1's polemic against
