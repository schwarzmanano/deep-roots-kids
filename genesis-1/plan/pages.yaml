    body: |
      From Creation to Glory

      Six days, and it was very good. On the seventh, God rested.

      But the story was not finished — and it still isn't.

      Genesis 1 opens with God speaking light into darkness. The last book of the Bible ends with a city that needs no sun, because the Lamb Himself is its light (Revelation 21:23). The light that broke on Day One was already pointing forward — to Jesus, the true Light of the world (John 1:9), who came into the darkness of a broken creation to shine again.

      Everything God called good in this book was made through Him and for Him (Colossians 1:16). And when sin broke what was very good, God did not leave it broken. He sent His own Son — the true Image of God (Colossians 1:15) — to live the life we could not live, die the death we deserved, and rise on a new "first day," making all things new.

      One day, the Bible promises, God will finish what He started here. A new heaven and a new earth (Revelation 21:1). And His people will rest — not for one day only, but forever — in Him (Hebrews 4:9–10).

      Creation. Fall. Redemption. Glorification.

      This book is Book One. The story is still being told — and by God's grace, so is yours.

      For families: read this page together, and ask — where do you see Jesus in the story of creation?


