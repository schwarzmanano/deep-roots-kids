# ── GATE 1 PASSED — signed 2026-09-17, see plan/theology-review.md ──
# All six decisions ruled and folded in below. `ruling:` fields record which
# decision governs a page, so the reasoning travels with the work.
#
# Quoted text uses the World English Bible (public domain) — DECISION-4.
# Page text is paraphrase unless `quote: true`.
# `teaching:` is a line for the parent to read aloud, set smaller beneath the text.

meta:
  scope: "Genesis 1:1 - 2:3"
  translation: "WEB (public domain)"
  reading_level: "ages 4-7, one sentence per page, read aloud by an adult"
  gate1_signed: "2026-09-17"

pages:

  - page: 3
    ref: "Genesis 1:1-2"
    title: "Before Anything"
    text: "Before there were mountains, before there were oceans, before there was one single bird singing one single song — there was God."   # author's Dad Teaching Script (Track 1), verbatim — selected 'use' 2026-10-04
    teaching: "Have you ever wondered — who made all of this?\nThe Bible answers that question in the very first verse of the very first book."   # author's Dad Teaching Script (Track 1), verbatim — selected 'use' 2026-10-04
    scene: "Deep water filling the whole lower half of the page under a wide sky, the darkness just
            beginning to yield in soft bands at the horizon. Fill the water with long rolling swells
            drawn as a SMALL NUMBER of LARGE smooth wave bands — about five or six broad curved
            shapes stacked down the page, each one a big open area a child can colour. Wide space
            inside every shape. Absolutely NO fine parallel ripple lines, NO hatching, NO texture,
            NO repeated thin strokes. A few large rounded clouds in the sky above. NO land, NO
            shoreline, NO rocks — dry ground has not been made yet. No living thing of any kind.
            No figure, no face, no hands, no light shaped like a person."
    alt: "An empty expanse of still water beneath an open sky."
    accept_ink_drift: true   # -51%: composition IS full (large wave bands + layered cloud),
                             # ink reads low because the shapes are large and open, which is the
                             # point for ages 4-7. Ruled 2026-09-18 after the unification pass.
    ruling: "DECISION-1 — depict nothing standing in for the Spirit. No dove, no face, no hand,
             no humanoid light. WLC 109. The absence itself carries the meaning."

  - page: 5
    ref: "Genesis 1:3-5"
    title: "Day One — Light"
    text: "He said, in verse 3,  \"Let there be light\" — and there was light."   # author's Dad Teaching Script (Track 1), verbatim — selected 'use' 2026-10-04
    teaching: "God did not need tools. He did not need helpers. He didn't need a hammer or a paintbrush or a whole team of builders. The Bible tells us God simply spoke."   # author's Dad Teaching Script (Track 1), verbatim — selected 'use' 2026-10-04
    scene: "A wide sky divided — one side bright with broad radiating bands of light rising from the
            horizon, the other side dark with a few large rounded cloud shapes. Below, deep water
            filling the lower half, drawn as FOUR OR FIVE LARGE smooth wave bands — big open areas a
            child can colour, with wide space inside each one. Absolutely NO fine parallel ripple
            lines, NO hatching, NO texture, NO repeated thin strokes.
            NO sun and NO moon anywhere — the lights are not made until the fourth day. NO land, NO
            shoreline — dry ground has not been made yet. No living thing. No figure of any kind."
    thicken_thin_strokes: true   # 6 strokes measured 1.59pt, under the 2pt floor — ruled: fix
    alt: "A sky split between light and darkness above calm water."
    ruling: "DECISION-1 — light is not shaped into a figure. No sun here; the sun comes on Day 4."

  - page: 7
    ref: "Genesis 1:6-8"
    title: "Day Two — Sky"
    text: "God placed an expanse between the waters. He called it sky, giving the waters above and below their places."   # author-supplied 2026-10-04, verbatim
    teaching: "God made a good and ordered world. He is not the author of confusion; his wise word gives creation its place and purpose."   # author-supplied 2026-10-04, verbatim
    scene: "A full sky of large rounded layered clouds above, and deep water below filling the lower
            half with rolling waves and ripple lines down to the bottom edge. A clear horizon band
            separates the water above from the water below. Draw generously so the page is full.
            NO land, NO shoreline, NO rocks — dry ground is not made until the next day. NO birds,
            NO fish, NO creature of any kind — nothing living has been made yet."
    alt: "Clouds above a broad expanse of water."

  - page: 9
    ref: "Genesis 1:9-10"
    title: "Day Three — Land and Seas"
    text: "He also said, \"Let there be land and sea\" — and it was so."   # author's Dad Teaching Script (Track 1), verbatim — selected 'use' 2026-10-04
    teaching: "God brought dry ground out of the deep, a firm place for life to flourish. In time, Jesus would show that he is the sure Rock on whom his people can stand."   # author-supplied 2026-10-04, verbatim
    scene: "Gentle hills and a curving shoreline meeting calm sea. Simple rounded rocks."
    alt: "Rolling hills beside a calm sea."

  - page: 11
    ref: "Genesis 1:11-13"
    title: "Day Three — Growing Things"
    text: "Thank you, God, for the flowers and the trees."   # author's Dad Teaching Script (Track 1), verbatim — selected 'use' 2026-10-04
    teaching: "Who made the wide, deep ocean, and the tallest tree, and the smallest flower? God did."   # author's Dad Teaching Script (Track 1), verbatim — selected 'use' 2026-10-04
    scene: "An orchard of growing things ONLY — no animals of any kind. Exactly TWO large rounded
            fruit trees, each bearing only THREE big simple round fruits. One small cluster of
            three large open flowers with broad petals. Two simple leafy plants on the ground.
            That is all — nothing else. Gentle hills behind and a wide empty stretch of open
            ground across the lower half of the page. Keep it sparse and uncluttered: few objects,
            large shapes, generous white space. Absolutely NO animals: no lion, no elephant, no
            rabbit, no tortoise, no birds, no fish, no creature of any kind — nothing has been
            created yet but plants."
    alt: "Trees bearing fruit among large flowers and leaves."
    amended: "2026-09-18 — CONTENT ERROR fixed. The page previously carried p23's elephant/lion/
              rabbit/tortoise cluster against the Day 3 vegetation verse — animals four days before
              they were created. Caused by style-reference content bleed at first generation."

  - page: 13
    ref: "Genesis 1:14-18"
    title: "Day Four — The Sun and the Moon"
    text: "Thank you, God, for the sun that warms us."   # author's Dad Teaching Script (Track 1), verbatim — selected 'use' 2026-10-04
    teaching: "He's not just powerful — he's the King over everything he made."   # author's Dad Teaching Script (Track 1), verbatim — selected 'use' 2026-10-04
    scene: "A large round sun high on one side and a crescent moon on the other, with several large
            rounded clouds between them. Below, layered rolling hills carrying a few full rounded
            trees, and a broad band of calm water across the foreground drawn as two or three large
            smooth wave shapes. Fill the page from top to bottom. Draw with LARGE open shapes a child can colour — wide space inside every shape. Absolutely NO hatching, NO fine parallel lines, NO repeated thin strokes, NO texture.
            NO animals, NO birds, NO fish — living creatures are not made until the days after this."
    alt: "A sun and a crescent moon in the sky above hills."
    ruling: "DECISION-2 — plain nouns for the child's vocabulary; Genesis 1's polemic against
             sun and moon worship preserved in the teaching line for the parent to read aloud."

  - page: 15
    ref: "Genesis 1:16"
    title: "Day Four — Stars"
    text: "God made the stars too—countless lights scattered across the night sky."   # author-supplied 2026-10-04, verbatim
    teaching: "God knows and names the stars he made. One star guided visitors to the child Jesus, but Christ himself is the true Light: the one to whom the stars, like all creation, point."   # author-supplied 2026-10-04, verbatim
    scene: "A night sky filled with many large simple five-pointed stars of clearly varying size,
            spread across the whole upper two thirds, with a few large rounded clouds among them.
            Below, a landscape of layered rolling hills with several full rounded trees, and a band
            of calm water across the foreground drawn as two or three large smooth wave shapes.
            Fill the page from top to bottom. Draw with LARGE open shapes a child can colour — wide space inside every shape. Absolutely NO hatching, NO fine parallel lines, NO repeated thin strokes, NO texture.
            NO animals, NO birds, NO fish — living creatures are not made until the days after this."
    alt: "A sky of many stars above a quiet horizon."

  - page: 17
    ref: "Genesis 1:20-21"
    title: "Day Five — Sea Creatures"
    text: "God filled the seas with living creatures, great and small, swimming through the waters he had made."   # author-supplied 2026-10-04, verbatim
    teaching: "The sea belongs to God and obeys its Maker. Jesus showed his power over it when he walked on the waves and calmed the storm."   # author-supplied 2026-10-04, verbatim
    scene: "Large friendly whale, round fish, simple sea creatures among gentle waves."
    alt: "A whale and fish swimming among waves."
    note: "Pre-gate test image exists. Discard it — generated before style lock and it failed
           the safe-area check (fish cropped at frame edge, waves running edge to edge)."

  - page: 19
    ref: "Genesis 1:21-23"
    title: "Day Five — Birds"
    text: "Who taught the tiny birds to sing their song? God did."   # author's Dad Teaching Script (Track 1), verbatim — selected 'use' 2026-10-04
    teaching: "God cares for even the sparrows. How much more does he care for his children, whom he made and welcomes through Jesus?"   # author-supplied 2026-10-04, verbatim
    scene: "Several large simple birds in flight among rounded clouds."
    alt: "Birds flying among clouds."

  - page: 21
    ref: "Genesis 1:24-25"
    title: "Day Six — Animals of the Land"
    text: "God filled the land with animals—large and small, wild and gentle. And it was so, just as God had spoken."   # author-supplied 2026-10-04, verbatim
    teaching: "The animals are part of God’s good creation. The Bible promises a day of peace under Christ’s rule, when God will make all things new."   # author-supplied 2026-10-04, verbatim
    scene: "Gentle large animals — cattle, sheep, a deer — standing in open grass."
    alt: "Farm and field animals standing in grass."
    accept_thin_strokes: true   # 1 stroke at 1.59pt, 0.09% of ink — ruled 2026-09-17: noise, accept
    ruling: "DECISION-3 — no dinosaurs. The book takes no position on an origins question that
             divides faithful readers in good conscience. Common land animals only."

  - page: 23
    ref: "Genesis 1:24-25"
    title: "Day Six — Wild Animals"
    text: "God made every kind of creature that moves along the ground, each according to its kind."   # author-supplied 2026-10-04, verbatim
    teaching: "God gave his creatures a place in the world he made. Not one is outside his care: he sees and sustains all that belongs to him."   # author-supplied 2026-10-04, verbatim
    scene: "Lion, elephant, rabbit and tortoise together in open landscape. Calm, friendly, no threat."
    alt: "A lion, elephant, rabbit and tortoise in an open landscape."
    style_reference: true
    note: "Chosen as the Gate 2 style-lock reference — four creatures at different scales is the
           strongest single test of line-weight consistency, region closure and safe area."

  - page: 25
    ref: "Genesis 1:26-27"
    title: "Day Six — People"
    text: "And who made you? God did too — and he made you on purpose, because he loves you."   # author's Dad Teaching Script (Track 1), verbatim — selected 'use' 2026-10-04
    teaching: "Thank you, God, for making the whole wide world — and for making me, too."   # author's Dad Teaching Script (Track 1), verbatim — selected 'use' 2026-10-04
    scene: "Two figures seen FROM BEHIND, at distance, small within a wide creation scene, faces
            entirely unseen. They are at work — tending plants, reaching toward an animal — in the
            act of the charge just given. Not posed, not static, not facing the viewer.
            No birds anywhere in this scene. No flying creature of any kind.
            HYBRID STYLE: the two human figures are drawn in the Deep Roots Kids flat-vector
            character construction — circle head, simple rounded tunic, every limb a single thin
            line, hands and feet plain ovals. The surrounding scene — plants, animals, ground,
            trees, sky — stays in this book's naturalistic line style.
            THE ONE CHANGE: the two figures must read clearly as one male and one female.
            Differentiate them ONLY by build and by hair length and shape — the female figure has
            longer, fuller hair reaching past the shoulder and a slighter build; the male figure
            has short cropped hair and a squarer, broader build. Both still seen from behind with
            no face visible. No glasses, no beads, no head wrap, no jewellery, no other markers."
    figures: "DECISION-5"   # -> style.md "## Human figures — DECISION-5, global rule"
    character_ref: "kids/_brand/character-ref-coloring.jpg"
    base_ref: "kids/_brand/p25-base-hybrid.jpg"
    alt: "Two small figures seen from behind, tending plants and animals in a wide landscape."
    ruling: "DECISION-5 — the image of God is shown in what they DO, not what they look like.
             Faces unseen means no bodily likeness is depicted, which sidesteps the Gen 2:25
             clothing question entirely — there is no fall-state to get wrong. No visual
             proximity to any depiction of God, consistent with DECISION-1."
    amended: "2026-09-17 — birds removed from this scene. THEOLOGICAL, not style: DECISION-1
              applied to this page. Nothing in Gen 1:26-28 places a bird beside the humans, and a
              solitary spread-winged bird here risks reading as the Spirit, or blurring the
              distinction the text draws between image-bearing humankind and every creature
              'after its kind' that came before them."
    amended_2: "2026-09-17 — figures differentiated as male and female. THEOLOGICAL: Gen 1:27 does
                not stop at 'in his own image' — 'male and female he created them' is part of the
                verse, not incidental to it, so the page should show it rather than two
                interchangeable silhouettes. Differentiated by build and hair only; fixed cast
                markers still excluded as anachronistic, per the earlier ruling."

  - page: 27
    ref: "Genesis 1:28-30"
    title: "Day Six — A Good Gift"
    text: "God blessed the people he had made and gave them plants and trees for food. His world was full of good gifts."   # author-supplied 2026-10-04, verbatim
    teaching: "God generously provided food for his creatures. Later, Jesus called himself the Bread of Life, the one who gives lasting life to all who come to him."   # author-supplied 2026-10-04, verbatim
    scene: "Two or three large simple fruit trees with a few big round fruits. One or two animals
            grazing. Same two figures from behind, at distance, reaching up to pick a fruit.
            Faces unseen. Open ground, plenty of empty space. No baskets, no woven objects,
            no bunches of small fruit.
            HYBRID STYLE: the two human figures use the Deep Roots Kids flat-vector construction —
            circle head with a simple hair shape, one simple sleeveless garment with the hem at or
            above the knee, every limb a single thin line, arms held away from the torso, hands and
            feet plain ovals. One reads male (short cropped hair, broader squarer build), one reads
            female (longer fuller hair past the shoulder, slighter build). Both from behind, faces
            unseen. The scene — trees, fruit, animals, ground — stays naturalistic.
            HANDS AND FEET, CRITICAL: every arm is ONE single thin line ending in a plain closed
            OVAL MITTEN for the hand — no fingers, no thumbs, no blobs, no clenched shapes. Every
            leg is ONE single thin line ending in a plain closed OVAL for the foot — no shoes, no
            heels, no soles, no toes, no ankles. Hands and feet drawn identically as simple ovals
            on the end of a single line, exactly as in the reference figures."
    figures: "DECISION-5"   # -> style.md "## Human figures — DECISION-5, global rule"
    character_ref: "kids/_brand/p25-figures-ref.jpg"
    base_ref: "kids/_brand/p27-base.jpg"
    alt: "Fruit trees and plants with animals nearby and two small figures gathering fruit."
    ruling: "DECISION-5 — figure treatment held consistent with p25."
    amended_3: "2026-09-18 — flat-vector construction applied, matching p25. NOTE: the wardrobe
                spec's collared shirt / kitenge wrap-dress distinction is deliberately NOT applied
                here. Those are the modern family cast's markers, and p27 depicts the first man and
                woman of Gen 1:28-30 — the same anachronism reasoning that excluded glasses, beads
                and head wraps from p25. Figures are differentiated by build and hair only.
                Flagged for the editor; reversible if ruled otherwise."
    amended: "2026-09-17 — scene simplified after QA. Original read 'abundant... baskets of fruit'
              and produced 13.2/13.0/9.7% ink against a 6.25% reference, with basket weave
              violating the no-crosshatching rule. Style fix only; DECISION-5 untouched."

  - page: 29
    ref: "Genesis 1:31"
    title: "Very Good"
    text: "God saw everything that he had made, and, behold, it was very good."
    quote_amended: "2026-09-29 — comma after 'and' restored to match WEB Gen 1:31 verbatim
                    (ebible.org/eng-web). Quotation corrected to source; not an authorship change."
    teaching: "Big and small, near and far, it all belongs to him, and it's all good, because he is good."   # author's Dad Teaching Script (Track 1), verbatim — selected 'use' 2026-10-04
    quote: true
    thicken_thin_strokes: true   # 3 strokes at 1.59pt from the fish detailing
    scene: "A wide panorama gathering the whole book together, deliberately DIFFERENT from the
            wild-animals page. Foreground: the sea along the bottom with two or three large fish and
            a whale breaking the surface. Middle: a shoreline and hills with a few animals seen in
            NEW poses — one lying down resting, one drinking at the water, one walking away from the
            viewer — not standing in a row facing forward. Sky: several birds in flight and a few
            stars appearing at the top. No lion, no elephant, no tortoise. The sea and sky creatures
            carry this page, with land animals secondary."
    alt: "A wide landscape with sea creatures, birds, hills and resting animals."
    amended: "2026-09-18 — recomposed so no two full-page illustrations read as the same drawing.
              Sea and sky creatures lead; land animals in new poses and reduced."

  - page: 31
    ref: "Genesis 2:1-3"
    title: "Day Seven — Rest"
    text: "On the seventh day, God finished his work. He rested from all he had made and made that day holy."   # author-supplied 2026-10-04, verbatim
    teaching: "God did not rest because he was tired. His rest showed that his work was complete and good. Jesus invites his people to find their rest in him, and one day they will share the joy of God’s finished new creation."   # author-supplied 2026-10-04, verbatim
    scene: "A quiet landscape at rest, drawn full and complete. Layered rolling hills with several
            full rounded trees, a broad band of calm water across the foreground as two or three
            large smooth wave shapes, large rounded clouds and a few stars appearing above. A few
            animals RESTING — one lying down, one standing still, one asleep — and nothing moving
            anywhere: no running, no flying, no activity of any kind. Stillness is the subject.
            Fill the page from top to bottom. Draw with LARGE open shapes a child can colour — wide space inside every shape. Absolutely NO hatching, NO fine parallel lines, NO repeated thin strokes, NO texture."
    alt: "A still, quiet landscape at rest."
    ruling: "DECISION-6 — 'day' left plain, as Moses left it. No gloss, no position between
             24-hour and framework readings. That conviction is formed in the home."

