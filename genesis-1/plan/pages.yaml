meta:
  scope: "Genesis 1:1 - 2:3"
  translation: "WEB (public domain)"
  reading_level: "ages 4-7, one sentence per page, read aloud by an adult"
  gate1_signed: "2026-09-17"

pages:

  - page: 3
    ref: "Genesis 1:1-2"
    title: "Before Anything"
    text: "In the beginning, God made the heavens and the earth."
    teaching: "Everything begins with God. Before there were people, or stars, or oceans, there was God — and one day, His Son will make it all new again."
    scene: "Deep water filling the whole lower half of the page under a wide sky, the darkness just
            beginning to yield in soft bands at the horizon. Fill the water with long rolling swells
            drawn as a SMALL NUMBER of LARGE smooth wave bands — about five or six broad curved
            shapes stacked down the page, each one a big open area a child can colour. Wide space
            inside every shape. Absolutely NO fine parallel ripple lines, NO hatching, NO texture,
            NO repeated thin strokes. A few large rounded clouds in the sky above. NO land, NO
            shoreline, NO rocks — dry ground has not been made yet. No living thing of any kind.
            No figure, no face, no hands, no light shaped like a person."
    alt: "An empty expanse of still water beneath an open sky."
    accept_ink_drift: true   # -51%: composition IS full (large wave bands + layered cloud),
                             # ink reads low because the shapes are large and open, which is the
                             # point for ages 4-7. Ruled 2026-09-18 after the unification pass.
    ruling: "DECISION-1 — depict nothing standing in for the Spirit. No dove, no face, no hand,
             no humanoid light. WLC 109. The absence itself carries the meaning."

  - page: 5
    ref: "Genesis 1:3-5"
    title: "Day One — Light"
    text: "God said, 'Let there be light!' And there was light."
    teaching: "God spoke, and light came from the dark. Jesus is called the Light of the World — He shines even in our darkest days."
    scene: "A wide sky divided — one side bright with broad radiating bands of light rising from the
            horizon, the other side dark with a few large rounded cloud shapes. Below, deep water
            filling the lower half, drawn as FOUR OR FIVE LARGE smooth wave bands — big open areas a
            child can colour, with wide space inside each one. Absolutely NO fine parallel ripple
            lines, NO hatching, NO texture, NO repeated thin strokes.
            NO sun and NO moon anywhere — the lights are not made until the fourth day. NO land, NO
            shoreline — dry ground has not been made yet. No living thing. No figure of any kind."
    thicken_thin_strokes: true   # 6 strokes measured 1.59pt, under the 2pt floor — ruled: fix
    alt: "A sky split between light and darkness above calm water."
    ruling: "DECISION-1 — light is not shaped into a figure. No sun here; the sun comes on Day 4."

  - page: 7
    ref: "Genesis 1:6-8"
    title: "Day Two — Sky"
    text: "God made the sky, and put water below it and water above it."
    teaching: "God gave the sky its shape and its place. He is a God of order, not confusion — everything He made, He made just right."
    scene: "A full sky of large rounded layered clouds above, and deep water below filling the lower
            half with rolling waves and ripple lines down to the bottom edge. A clear horizon band
            separates the water above from the water below. Draw generously so the page is full.
            NO land, NO shoreline, NO rocks — dry ground is not made until the next day. NO birds,
            NO fish, NO creature of any kind — nothing living has been made yet."
    alt: "Clouds above a broad expanse of water."

  - page: 9
    ref: "Genesis 1:9-10"
    title: "Day Three — Land and Seas"
    text: "God gathered the water together, and dry ground appeared."
    teaching: "Dry land, safe and solid, out of the deep water. God still makes safe, solid ground for His children — through Jesus, our feet are set on the Rock."
    scene: "Gentle hills and a curving shoreline meeting calm sea. Simple rounded rocks."
    alt: "Rolling hills beside a calm sea."

  - page: 11
    ref: "Genesis 1:11-13"
    title: "Day Three — Growing Things"
    text: "God said, 'Let the land grow plants and trees!' And it was so."
    teaching: "God made every plant and tree before there was anyone to eat from them. Jesus called Himself the true Bread — the food our hearts need most."
    scene: "An orchard of growing things ONLY — no animals of any kind. Exactly TWO large rounded
            fruit trees, each bearing only THREE big simple round fruits. One small cluster of
            three large open flowers with broad petals. Two simple leafy plants on the ground.
            That is all — nothing else. Gentle hills behind and a wide empty stretch of open
            ground across the lower half of the page. Keep it sparse and uncluttered: few objects,
            large shapes, generous white space. Absolutely NO animals: no lion, no elephant, no
            rabbit, no tortoise, no birds, no fish, no creature of any kind — nothing has been
            created yet but plants."
    alt: "Trees bearing fruit among large flowers and leaves."
    amended: "2026-09-18 — CONTENT ERROR fixed. The page previously carried p23's elephant/lion/
              rabbit/tortoise cluster against the Day 3 vegetation verse — animals four days before
              they were created. Caused by style-reference content bleed at first generation."

